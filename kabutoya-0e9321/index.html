          <h2 class="ttl-en">Okami</h2>
          <span class="ttl-ja">迎えるひと</span>

        <p class="txt" style="margin-top:1.6em">This page and the next are a two-page summary for English-speaking guests. The rest of the site — our seasons, our food, our rooms, and how to reach us — is written in Japanese. If you read Japanese, <a class="link" href="#/">continue to the Japanese homepage</a>. Our staff speak limited English, but email is usually the easiest way to reach us: <a class="link" href="mailto:info@kabutoya.net">info@kabutoya.net</a>.</p>
